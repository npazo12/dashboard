<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Icono para favoritos y pantalla de inicio -->
<link rel="icon" type="image/png" href="icono.png">
<style>
:root{--bg:#0d0d14;--card:#2c2c2e;--tx:#f5f5f7;--mut:#98989d;--bd:#3a3a3c;--ac:#0a84ff;--onac:#fff;--err:#d9827a;--ok:#30d158;--warn:#ff9f0a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

/* --- ESTILOS PARA CELULAR (Por defecto) --- */
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;max-width:100%;margin-inline:auto;font-size:18px;-webkit-text-size-adjust:100%}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;background:var(--card);padding:16px;border:1px solid var(--bd);border-radius:18px}
h1{font-size:26px;margin:0 0 4px;font-weight:800}
.sub{color:var(--mut);font-size:16px;margin-bottom:16px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;text-align:center}
.stat b{font-size:32px;display:block;font-weight:800}
.stat span{font-size:15px;color:var(--mut);font-weight:600}
form{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px;box-shadow:0 3px 10px rgba(0,0,0,0.04)}
input,select,button{font:inherit;font-size:18px;padding:16px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;-webkit-appearance:none}
button{cursor:pointer;font-weight:700}
.add{background:var(--ac);color:var(--onac);border:0;font-size:19px;padding:18px}
.filters{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
.filters select{flex:1;padding:16px;font-size:17px}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
.col{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;min-height:160px;box-shadow:0 2px 8px rgba(0,0,0,0.03)}
.col h2{font-size:20px;margin:0 0 14px;color:var(--tx);border-bottom:3px solid var(--bd);padding-bottom:10px;font-weight:800}
.t{border:1px solid var(--bd);border-left:7px solid var(--mut);border-radius:14px;padding:16px;margin-bottom:14px;background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,0.03)}
.t.Alta{border-left-color:var(--ac)}.t.Media{border-left-color:var(--warn)}.t.Baja{border-left-color:var(--ok)}
.t .n{font-weight:800;font-size:19px;margin-bottom:8px;line-height:1.35}
.t .m{font-size:16px;color:var(--mut);margin-top:8px;line-height:1.5}
.t .m.late{color:var(--err);font-weight:800}
.acts{display:flex;gap:10px;margin-top:14px}
.acts button{padding:12px 14px;font-size:15px;flex:1;border-radius:12px;font-weight:700}
.empty{color:var(--mut);font-size:16px;text-align:center;padding:24px}
.ch{font-size:20px;margin:28px 0 12px;font-weight:800}
.lb{font-size:16px;color:var(--mut);display:flex;flex-direction:column;gap:8px;font-weight:700}
.extra{display:grid;grid-template-columns:1fr;gap:16px}
.extra[hidden]{display:none}
.calbox{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
.ev{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--bd);font-size:17px}
.ev:last-child{border:0}
.ev time{color:var(--mut);min-width:180px;font-size:16px;font-weight:700}
.ev a{color:var(--tx);text-decoration:none}
.ev a:hover{text-decoration:underline}

/* --- VERSIÓN COMPUTADORA (Pantallas mayores a 768px: Ancho total de pantalla) --- */
@media(min-width:768px){
  body{padding:24px 32px;font-size:14px;max-width:100% !important} /* Ocupa todo el monitor sin restricciones */
  .stats{grid-template-columns:repeat(4,1fr);gap:16px}
  .stat b{font-size:26px}
  form{grid-template-columns:repeat(3,1fr);align-items:end;padding:20px}
  form input[type=text]{grid-column:1/-1}
  .extra{grid-column:1/-1;grid-template-columns:repeat(3,1fr)}
  input,select,button{font-size:14px;padding:10px}
  .add{font-size:14px;padding:10px}
  .filters{display:flex;gap:12px}
  .filters select{padding:10px;font-size:14px}
  
  /* Sistema de 3 columnas distribuidas uniformemente ocupando todo el ancho */
  .cols{display:grid;grid-template-columns:repeat(3, 1fr);gap:24px;align-items:start;width:100%}
  .col{min-height:400px;padding:20px}
  .col h2{font-size:18px}
  .t{padding:14px;margin-bottom:12px}
  .t .n{font-size:15px}
  .t .m{font-size:13px}
  .acts{gap:6px}
  .acts button{padding:6px 8px;font-size:12px}
}

/* Pantalla de acceso */
#lock-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;padding:20px}
#lock-box{background:var(--card);border:1px solid var(--bd);padding:32px;border-radius:24px;max-width:420px;width:100%;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,0.1)}
#lock-box h2{margin-top:0;font-size:28px;font-weight:800}
#lock-box input{width:100%;margin-bottom:18px;font-size:20px;padding:18px}
#lock-box button{width:100%;background:var(--ac);color:var(--onac);border:0;padding:18px;font-size:20px}
.lock-error{color:var(--err);font-size:18px;margin-top:14px;font-weight:800}

/* --- ESTÉTICA OSCURA TIPO APPLE (solo colores y acabados) --- */
body{font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--bg);border-radius:14px}
.stat,form,.calbox,#lock-box{box-shadow:none;border-radius:14px}
.col{background:var(--bg);box-shadow:none;border-radius:14px}
.col h2{border-bottom:1px solid var(--bd);letter-spacing:-.01em}
.t{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--mut);border-radius:12px;box-shadow:none}
.t.Alta{border-color:#0a84ff;background:#10294a}
input,select,button{background:var(--bg);border:1px solid #48484a;border-radius:10px}
input:focus,select:focus{outline:none;border-color:var(--ac)}
button{background:var(--bd);color:var(--tx)}
.add,#lock-box button{background:var(--ac);color:#fff;border:0;border-radius:999px}
.acts button{background:var(--bd)}
.acts button[data-a="next"]{background:rgba(10,132,255,.18);color:#4da3ff}
.acts button[data-a="del"]{background:rgba(217,130,122,.14)!important;color:var(--err)!important}
.ev a{color:var(--tx)}
.acts button.ic{flex:0 0 40px;width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px}
.acts button.ic[data-a="edit"]{background:var(--bd)!important;color:var(--mut)!important}
.acts button.ic[data-a="next"]{background:rgba(10,132,255,.18)!important;color:#4da3ff!important}
.acts{justify-content:flex-end}
@media(min-width:768px){.cols{gap:44px}}
#lock-screen{background:var(--bg)}
#lock-form{display:flex;flex-direction:column;gap:0;padding:0;border:0;background:transparent;margin-bottom:0}
#lock-form input,#lock-form button{width:100%}

/* --- TARJETAS ESTILO APPLE --- */
.col{padding:18px 14px}
.col h2{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);border-bottom:0;padding:0 6px 4px;margin:0 0 12px}
.t,.t.Alta,.t.Media,.t.Baja{background:var(--card);border:0;border-radius:16px;padding:16px 16px 12px;margin-bottom:12px;box-shadow:0 0 0 1px rgba(255,255,255,.05);transition:background .2s ease,transform .2s ease}
.t:hover{background:#333336}
.t.Alta{box-shadow:0 0 0 1px rgba(10,132,255,.5)}
.t .n{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin-bottom:6px}
.t .m{font-size:13px;line-height:1.55;margin-top:0;color:var(--mut);font-weight:400}
.t .m.late{color:var(--err);font-weight:500}
.acts{gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);justify-content:flex-end}
.acts button.ic{flex:0 0 32px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.08)!important;color:var(--mut)!important;transition:background .15s ease,color .15s ease}
.acts button.ic svg{width:16px;height:16px}
.acts button.ic:hover{background:rgba(255,255,255,.16)!important;color:var(--tx)!important}
.acts button.ic[data-a="next"]{background:rgba(10,132,255,.2)!important;color:#4da3ff!important}
.acts button.ic[data-a="next"]:hover{background:rgba(10,132,255,.32)!important}
.acts button.ic[data-a="del"]:hover{background:rgba(217,130,122,.2)!important;color:var(--err)!important}
.empty{font-size:14px}

/* --- CELULAR: TEXTOS Y BOTONES MÁS GRANDES --- */
@media(max-width:767px){
body{padding:16px;font-size:19px}
h1{font-size:30px}
header .sub,#hoy{font-size:18px}
#sync,#estado{font-size:17px}
.stat{padding:20px 12px}
.stat b{font-size:42px}
.stat span{font-size:18px}
input,select{font-size:19px;padding:18px}
.add{font-size:20px;padding:20px}
.filters select{font-size:19px;padding:18px}
.lb{font-size:17px}
.col{padding:20px 14px}
.col h2{font-size:16px;padding:0 6px 4px;margin-bottom:14px}
.t,.t.Alta,.t.Media,.t.Baja{padding:20px 18px 14px;border-radius:18px}
.t .n{font-size:21px;line-height:1.3;margin-bottom:8px}
.t .m{font-size:17px;line-height:1.6}
.acts{gap:12px;margin-top:16px;padding-top:14px}
.acts button.ic{flex:0 0 48px;width:48px;height:48px}
.acts button.ic svg{width:22px;height:22px}
.empty{font-size:18px}
.ch{font-size:22px}
.ev{font-size:18px}
.ev time{font-size:17px}
#lock-box input,#lock-box button{font-size:20px}
}

/* --- DISEÑO LIMPIO: MENOS LÍNEAS, MÁS ESPACIO --- */
header{background:transparent;border:0;padding:4px 2px;margin-bottom:12px}
header button{width:auto;padding:10px 18px;border:0;border-radius:999px;background:#1c1c1e}
.stats{grid-template-columns:repeat(4,1fr);gap:0;background:#1c1c1e;border-radius:16px;padding:12px 4px;margin-bottom:14px}
.stat,.stat:hover{background:transparent;border:0;border-radius:0;padding:0}
.stat b{font-size:26px;font-weight:700;line-height:1.1;margin-bottom:2px}
.stat span{font-size:14px;font-weight:500}
#sVen{color:var(--tx)}
form{background:#1c1c1e;border:0;border-radius:16px;padding:14px;gap:12px}
input,select{background:#2c2c2e;border:0;border-radius:12px}
input:focus,select:focus{box-shadow:0 0 0 2px var(--ac)}
.filters{gap:10px;margin-bottom:14px}
.filters select{background:#1c1c1e;padding:14px 16px}
.col{background:transparent;border:0;padding:0;min-height:0;border-radius:0}
.col h2{border:0;color:var(--mut);padding:0 4px;margin:6px 0 10px}
.t,.t.Alta,.t.Media,.t.Baja{background:#1c1c1e;border:0;box-shadow:none;border-radius:16px}
.t:hover{background:#242426}
.t .m,.t .m.late{color:var(--mut);font-weight:400}
.ov{display:inline-flex;vertical-align:-3px;margin-left:6px;color:#c7c7cc}
.ov svg{width:16px;height:16px}
.acts{border-top:0;padding-top:0;margin-top:10px}
.acts button.ic{background:rgba(255,255,255,.06)!important}
.calbox{background:#1c1c1e;border:0}
.ev{border-bottom:0;padding:10px 0}
#lock-box{border:0;background:#1c1c1e}
@media(max-width:767px){
.stat b{font-size:28px}
.stat span{font-size:14px}
.stats{padding:14px 4px}
.t,.t.Alta,.t.Media,.t.Baja{padding:18px 18px 12px}
.ov svg{width:18px;height:18px}
.acts button.ic{flex:0 0 44px;width:44px;height:44px}
}

/* --- FONDO CON PROFUNDIDAD, VIDRIO Y COLOR --- */
html{background:#0d0d14}
body{background:radial-gradient(130% 55% at 50% -8%,rgba(10,132,255,.24),rgba(10,132,255,.07) 45%,transparent 70%),#0d0d14;background-attachment:fixed;min-height:100vh}
#lock-screen{background:radial-gradient(130% 55% at 50% -8%,rgba(10,132,255,.24),transparent 70%),#0d0d14}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em}
.stats,form,.t,.t.Alta,.t.Media,.t.Baja,.calbox,#lock-box{background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 8px 24px rgba(0,0,0,.18)}
.t:hover{background:rgba(255,255,255,.09)}
header button,.filters select{background:rgba(255,255,255,.07);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
input,select{background:rgba(255,255,255,.07)}
option{background:#1c1c1e;color:#f5f5f7}
.stat svg{display:block;margin:0 auto 6px;width:18px;height:18px}
.col h2::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px;background:var(--mut)}
.col:nth-child(1) h2::before{background:#0a84ff}
.col:nth-child(2) h2::before{background:#ff9f0a}
.col:nth-child(3) h2::before{background:#30d158}
.acts button.ic{background:rgba(255,255,255,.08)!important}

/* --- BOTÓN DE TEMA (sol / luna) --- */
.hbtns{display:flex;align-items:center;gap:10px}
#tema{width:40px;height:40px;padding:0;border:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);color:var(--tx);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transition:background .2s ease,transform .2s ease}
#tema:active{transform:scale(.92)}
#tema svg{width:20px;height:20px}
html[data-theme="dark"] #tema .moon,html[data-theme="light"] #tema .sun{display:none}
@media(max-width:767px){#tema{width:44px;height:44px}#tema svg{width:22px;height:22px}}

/* --- MODO CLARO --- */
html[data-theme="light"]{color-scheme:light;background:#f2f2f7;--bg:#f2f2f7;--card:#ffffff;--tx:#1c1c1e;--mut:#6e6e73;--bd:#d9d9de;--ac:#007aff;--err:#c4605a}
html[data-theme="light"] body{background:radial-gradient(130% 55% at 50% -8%,rgba(0,122,255,.14),rgba(0,122,255,.04) 45%,transparent 70%),#f2f2f7;color:#1c1c1e}
html[data-theme="light"] #lock-screen{background:radial-gradient(130% 55% at 50% -8%,rgba(0,122,255,.14),transparent 70%),#f2f2f7}
html[data-theme="light"] .stats,html[data-theme="light"] form,html[data-theme="light"] .t,html[data-theme="light"] .t.Alta,html[data-theme="light"] .t.Media,html[data-theme="light"] .t.Baja,html[data-theme="light"] .calbox,html[data-theme="light"] #lock-box{background:rgba(255,255,255,.78);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 4px 16px rgba(0,0,0,.06)}
html[data-theme="light"] .t:hover{background:#fff}
html[data-theme="light"] header button,html[data-theme="light"] .filters select,html[data-theme="light"] #tema{background:rgba(255,255,255,.8);color:#1c1c1e;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 4px rgba(0,0,0,.08)}
html[data-theme="light"] input,html[data-theme="light"] select{background:rgba(0,0,0,.05);color:#1c1c1e}
html[data-theme="light"] input::placeholder{color:#8e8e93}
html[data-theme="light"] option{background:#fff;color:#1c1c1e}
html[data-theme="light"] .ov{color:#6e6e73}
html[data-theme="light"] .acts button.ic{background:rgba(0,0,0,.06)!important;color:#6e6e73!important}
html[data-theme="light"] .acts button.ic:hover{background:rgba(0,0,0,.11)!important;color:#1c1c1e!important}
html[data-theme="light"] .acts button.ic[data-a="next"]{background:rgba(0,122,255,.12)!important;color:#007aff!important}
html[data-theme="light"] .acts button.ic[data-a="next"]:hover{background:rgba(0,122,255,.2)!important}
html[data-theme="light"] .acts button.ic[data-a="del"]:hover{background:rgba(196,96,90,.15)!important;color:#c4605a!important}
html[data-theme="light"] .add,html[data-theme="light"] #lock-box button{background:#007aff;color:#fff}

/* ================================================================
   GUÍA DE DISEÑO — Plus Jakarta Sans, tokens oklch, vidrio, radios
   (el tema sigue alternándose con data-theme en <html>)
   ================================================================ */
html[data-theme]{
  --font-sans:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --background:oklch(0.975 0.005 260);
  --foreground:oklch(0.129 0.042 264.695);
  --card:oklch(1 0 0);
  --popover:oklch(1 0 0);
  --primary:oklch(0.208 0.042 265.755);
  --primary-foreground:oklch(0.984 0.003 247.858);
  --secondary:oklch(0.968 0.007 247.896);
  --muted:oklch(0.968 0.007 247.896);
  --muted-foreground:oklch(0.554 0.046 257.417);
  --accent:oklch(0.968 0.007 247.896);
  --destructive:oklch(0.577 0.245 27.325);
  --border:oklch(0.929 0.013 255.508);
  --input:oklch(0.929 0.013 255.508);
  --ring:oklch(0.704 0.04 256.788);
  --pending:oklch(0.6 0.19 255);
  --progress:oklch(0.72 0.17 60);
  --done:oklch(0.66 0.16 155);
  --overdue:oklch(0.6 0.2 300);
  --glow:radial-gradient(60% 80% at 15% 0%,oklch(0.6 0.19 255 / 12%),transparent 70%),radial-gradient(50% 60% at 90% 10%,oklch(0.6 0.2 300 / 10%),transparent 70%);
  /* variables antiguas apuntando a los tokens nuevos */
  --bg:var(--background);--tx:var(--foreground);--mut:var(--muted-foreground);--bd:var(--border);
  --ac:var(--pending);--onac:oklch(1 0 0);--err:var(--destructive);--ok:var(--done);--warn:var(--progress);
  color-scheme:light;
}
html[data-theme="dark"]{
  --background:oklch(0.14 0.02 265);
  --foreground:oklch(0.97 0.005 260);
  --card:oklch(0.19 0.025 265);
  --primary:oklch(0.929 0.013 255.508);
  --primary-foreground:oklch(0.208 0.042 265.755);
  --muted:oklch(0.279 0.041 260.031);
  --muted-foreground:oklch(0.704 0.04 256.788);
  --accent:oklch(0.279 0.041 260.031);
  --border:oklch(1 0 0 / 10%);
  --input:oklch(1 0 0 / 15%);
  --ring:oklch(0.551 0.027 264.364);
  --pending:oklch(0.7 0.16 255);
  --progress:oklch(0.8 0.15 70);
  --done:oklch(0.76 0.15 155);
  --overdue:oklch(0.72 0.17 300);
  --glow:radial-gradient(60% 80% at 15% 0%,oklch(0.55 0.2 260 / 30%),transparent 70%),radial-gradient(50% 60% at 90% 10%,oklch(0.55 0.2 300 / 22%),transparent 70%);
  color-scheme:dark;
}

/* Fondo con resplandor (en <html> para que cubra toda la pantalla) */
html[data-theme]{background-color:var(--background);background-image:var(--glow);background-attachment:fixed;background-repeat:no-repeat}
html[data-theme][data-theme] body{background:transparent;color:var(--foreground);font-family:var(--font-sans);font-size:14px;max-width:1344px!important;margin-inline:auto;padding:24px 16px;min-height:100vh}

/* Superficie de vidrio (tarjetas y campos) */
html[data-theme][data-theme] .stat,
html[data-theme][data-theme] #f,
html[data-theme][data-theme] .calbox,
html[data-theme][data-theme] #lock-box,
html[data-theme][data-theme] .filters select,
html[data-theme][data-theme] #tema{
  background:color-mix(in oklab,var(--card) 70%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid var(--border);box-shadow:none;
}

/* Encabezado */
html[data-theme][data-theme] header>div:first-child{display:flex;flex-direction:column-reverse;gap:4px}
html[data-theme][data-theme] h1{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:0}
html[data-theme][data-theme] #hoy{font-size:14px;font-weight:500;color:var(--muted-foreground);line-height:1.4}

<script>
(function(){
  var t="dark";
  try{var g=localStorage.getItem("tema");if(g==="light"||g==="dark")t=g}catch(e){}
  document.documentElement.setAttribute("data-theme",t);
  window.cambiarTema=function(){
    var d=document.documentElement;
    var n=d.getAttribute("data-theme")==="light"?"dark":"light";
    d.setAttribute("data-theme",n);
    try{localStorage.setItem("tema",n)}catch(e){}
    var m=document.querySelector('meta[name="theme-color"]');
    if(!m){m=document.createElement("meta");m.name="theme-color";document.head.appendChild(m)}
    m.content=n==="light"?"#f2f2f7":"#0d0d14";
  };
})();
</script>

<script>
/* ===== CONFIGURACIÓN DE FIREBASE ===== */
var firebaseConfig = {
  apiKey: "AIzaSyB0SNib1UsqwH0zpLxWv_W6UK0WhOkWNh0",
  authDomain: "dashboard-mkt-95e02.firebaseapp.com",
  projectId: "dashboard-mkt-95e02",
  appId: "1:747884154633:web:1b7d4c079767868a274dd8"
};
/* ===================================== */

var ESTATUS = ["Pendiente","En proceso","Listo"];
var tareas = [];
var col = null;
var auth = null;
var unsub = null;
var ocupado = false;

function setSync(msg, err){
  var s = document.getElementById("sync");
  s.textContent = msg;
  s.style.color = err ? "var(--err)" : "";
}
function avisar(msg){ document.getElementById("estado").textContent = msg; }
function errLogin(msg){ document.getElementById("lock-error").textContent = msg; }

if(firebaseConfig.apiKey.indexOf("PEGA_AQUI") === 0){
  errLogin("Falta pegar la configuración de Firebase en el archivo.");
} else {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  col = firebase.firestore().collection("tareas");
  auth.onAuthStateChanged(function(u){
    if(u){ mostrarDashboard(); } else { mostrarLogin(); }
  });
}

function entrar(e){
  e.preventDefault();
  if(!auth){ errLogin("Falta pegar la configuración de Firebase en el archivo."); return; }
  errLogin("");
  auth.signInWithEmailAndPassword(
    document.getElementById("email-input").value.trim(),
    document.getElementById("pass-input").value
  ).catch(function(){ errLogin("Correo o contraseña incorrectos."); });
}
function cerrarSesion(){ if(auth) auth.signOut(); }

function mostrarLogin(){
  if(unsub){ unsub(); unsub = null; }
  tareas = []; pintar();
  document.getElementById("pass-input").value = "";
  document.getElementById("main-content").style.display = "none";
  document.getElementById("lock-screen").style.display = "flex";
}
function mostrarDashboard(){
  document.getElementById("lock-screen").style.display = "none";
  document.getElementById("main-content").style.display = "block";
  iniciarNube();
}

/* ---------- Actividades compartidas ---------- */
function iniciarNube(){
  if(unsub) return;
  setSync("Conectando con la nube…");
  var timer = setTimeout(function(){
    setSync("Aún no se logra conectar. Lo que ves puede estar desactualizado.", true);
  }, 10000);
  unsub = col.onSnapshot(function(snap){
    if(!snap.metadata.fromCache){ clearTimeout(timer); setSync("Sincronizado en la nube ✓"); }
    tareas = snap.docs.map(function(d){ var x = d.data(); x.id = d.id; return x; });
    pintar();
  }, function(err){
    clearTimeout(timer);
    setSync("Error de sincronización (" + (err && err.code || "desconocido") + "). Revisa las reglas de Firestore.", true);
  });
}

function datosDe(t){ return {n:t.n, ag:t.ag, ar:t.ar, ti:t.ti, f:t.f, e:t.e}; }

async function operar(fn){
  if(!col){ avisar("Aún no hay conexión con la nube."); return false; }
  if(ocupado) return false;
  ocupado = true;
  try { await fn(); return true; }
  catch(e){ avisar("No se pudo guardar (" + (e && e.code || "error") + "). Intenta de nuevo."); return false; }
  finally { ocupado = false; }
}

/* ---------- Utilidades ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function bonita(s){if(!s)return"Sin fecha";return new Date(s).toLocaleString("es-MX",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function mismoDia(a,b){return a.toDateString()===b.toDateString()}

var IC={
clock:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
prev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
warn:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
next:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
edit:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
del:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>'};
function pintar(){
  var ag=document.getElementById("fAg").value,ar=document.getElementById("fAr").value,ti=document.getElementById("fTi").value;
  var ahora=new Date(),hoy=0,ven=0,ok=0,ab=0;
  tareas.forEach(function(t){
    if(t.e==="Listo"){ok++;return}
    ab++;
    if(t.f){var d=new Date(t.f);if(mismoDia(d,ahora))hoy++;if(d<ahora)ven++}
  });
  document.getElementById("sTot").textContent=ab;
  document.getElementById("sHoy").textContent=hoy;
  document.getElementById("sVen").textContent=ven;
  document.getElementById("sOk").textContent=ok;

  var html="";
  ESTATUS.forEach(function(est){
    var lista=tareas.filter(function(t){return t.e===est&&(!ag||t.ag===ag)&&(!ar||t.ar===ar)&&(!ti||t.ti===ti)});
    lista.sort(function(a,b){return (a.f||"9").localeCompare(b.f||"9")});
    html+='<div class="col"><h2><span>'+est+'</span><span class="cnt">'+lista.length+'</span></h2>';
    if(!lista.length)html+='<div class="empty">Sin actividades</div>';
    lista.forEach(function(t){
      var late=t.e!=="Listo"&&t.f&&new Date(t.f)<ahora;
      html+='<div class="t '+esc(t.p||"")+'"><div class="n">'+esc(t.n)+'</div><div class="chips"><span class="chip">'+esc(t.ag)+'</span><span class="chip">'+esc(t.ar)+'</span>'+(t.ti?'<span class="chip">'+esc(t.ti)+'</span>':'')+'</div><div class="foot"><div class="m'+(late?' late':'')+'">'+IC.clock+'<span>'+bonita(t.f)+(late?' · Vencido':'')+'</span></div><div class="acts">';
      if(est!=="Pendiente")html+='<button class="ic" data-a="prev" title="Atrás" aria-label="Atrás" data-i="'+esc(t.id)+'">'+IC.prev+'</button>';
      if(est!=="Listo")html+='<button class="ic" data-a="next" title="Avanzar" aria-label="Avanzar" data-i="'+esc(t.id)+'">'+IC.next+'</button>';
      html+='<button class="ic" data-a="edit" title="Editar" aria-label="Editar" data-i="'+esc(t.id)+'" style="background:var(--bd);color:var(--tx);">'+IC.edit+'</button><button class="ic" data-a="del" title="Borrar" aria-label="Borrar" data-i="'+esc(t.id)+'" style="background:#fde8e8;color:var(--err);">'+IC.del+'</button></div></div></div>';
    });
    html+='</div>';
  });
  document.getElementById("cols").innerHTML=html;
}

document.getElementById("hoy").textContent=new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});

/* ---------- Agregar ---------- */
document.getElementById("f").addEventListener("submit",async function(e){
  e.preventDefault();
  if(EDIT!==null){editarGuardar();return}
  var nombre=document.getElementById("nombre").value.trim();
  if(!nombre)return;
  var t={n:nombre,ag:document.getElementById("agencia").value,ar:document.getElementById("area").value,ti:document.getElementById("tipo").value,f:document.getElementById("fecha").value,e:"Pendiente"};
  var ok=await operar(function(){return col.doc(String(Date.now())).set(t)});
  if(ok){
    document.getElementById("nombre").value="";document.getElementById("fecha").value="";extras();
    avisar("Actividad guardada.");
  }
});

/* ---------- Avanzar / retroceder / editar / borrar ---------- */
document.getElementById("cols").addEventListener("click",async function(e){
  var b=e.target.closest("button");if(!b)return;
  var id=b.dataset.i,t=tareas.filter(function(x){return x.id===id})[0];if(!t)return;
  if(b.dataset.a==="edit"){editar(t);return}
  var k=ESTATUS.indexOf(t.e);
  if(b.dataset.a==="next")await operar(function(){return col.doc(id).update({e:ESTATUS[k+1]})});
  if(b.dataset.a==="prev")await operar(function(){return col.doc(id).update({e:ESTATUS[k-1]})});
  if(b.dataset.a==="del")await operar(function(){return col.doc(id).delete()});
});

/* ---------- Filtros y áreas ---------- */
document.getElementById("fAg").addEventListener("change",function(){areasFiltro();pintar()});
document.getElementById("fTi").addEventListener("change",pintar);
document.getElementById("agencia").addEventListener("change",areasForm);
document.getElementById("fAr").addEventListener("change",pintar);
var AREAS={"Nissan Tampico":["General","Gerencia General","Nuevos","Refacciones","Seminuevos","Servicio"],"INFINITI":["General","Gerencia General","Nuevos","Seminuevos"]};
function llenar(sel,lista,todas){var v=sel.value;sel.innerHTML=(todas?'<option value="">Todas las áreas</option>':'')+lista.map(function(a){return '<option>'+a+'</option>'}).join('');if(lista.indexOf(v)>=0||(todas&&v===""))sel.value=v}
function areasForm(){llenar(document.getElementById("area"),AREAS[document.getElementById("agencia").value],false)}
function areasFiltro(){var ag=document.getElementById("fAg").value;llenar(document.getElementById("fAr"),ag?AREAS[ag]:AREAS["Nissan Tampico"],true)}

/* ---------- Edición ---------- */
var EDIT=null;
function editar(t){
  EDIT=t.id;
  var n=document.getElementById("nombre");n.value=t.n;
  document.getElementById("extra").hidden=false;
  document.getElementById("agencia").value=t.ag;areasForm();
  document.getElementById("area").value=t.ar;
  document.getElementById("tipo").value=t.ti||"Otro";
  document.getElementById("fecha").value=t.f||"";
  document.getElementById("btnAdd").textContent="Guardar cambios";
  document.getElementById("btnCancel").hidden=false;
  n.focus();window.scrollTo({top:0,behavior:"smooth"});
}
function salirEdicion(){EDIT=null;document.getElementById("btnAdd").textContent="Agregar actividad";document.getElementById("btnCancel").hidden=true}
async function editarGuardar(){
  var g=function(i){return document.getElementById(i).value};
  var o=tareas.filter(function(x){return x.id===EDIT})[0];
  if(!o){salirEdicion();return}
  var nuevo=datosDe(o);
  nuevo.n=g("nombre").trim();nuevo.ag=g("agencia");nuevo.ar=g("area");nuevo.ti=g("tipo");nuevo.f=g("fecha");
  var id=EDIT;
  var ok=await operar(function(){return col.doc(id).set(nuevo)});
  if(ok){
    document.getElementById("nombre").value="";document.getElementById("fecha").value="";
    salirEdicion();extras();avisar("Cambios guardados.");
  }
}
function extras(){var i=document.getElementById("nombre"),v=i.value;if(v&&v.charAt(0)!==v.charAt(0).toUpperCase()){var p=i.selectionStart;i.value=v.charAt(0).toUpperCase()+v.slice(1);try{i.setSelectionRange(p,p)}catch(e){}}document.getElementById("extra").hidden=!i.value.trim()}
document.getElementById("nombre").value="";
document.getElementById("nombre").addEventListener("input",extras);
document.getElementById("btnCancel").addEventListener("click",function(){salirEdicion();document.getElementById("nombre").value="";document.getElementById("fecha").value="";extras();document.getElementById("estado").textContent=""});

areasForm();areasFiltro();pintar();
</script>
</body>
</html>
