<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard</title>
<!-- Icono para favoritos y pantalla de inicio -->
<link rel="icon" type="image/png" href="icono.png">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1c1c1a;--mut:#555450;--bd:#dcdad3;--ac:#0f766e;--onac:#fff;--err:#c3002f;--ok:#2e7d4f;--warn:#b26a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#222220;--tx:#f0efeb;--mut:#a09f99;--bd:#37362f;--ac:#2dd4bf;--onac:#04201c;--err:#ff5c7c;--ok:#5fc08a;--warn:#e8a94a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;max-width:1000px;margin-inline:auto;font-size:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mut);font-size:15px;margin-bottom:16px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center}
.stat b{font-size:28px;display:block}
.stat span{font-size:14px;color:var(--mut)}
form{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
input,select,button{font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
button{cursor:pointer;font-weight:600}
.add{background:var(--ac);color:var(--onac);border:0}
.filters{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px}
@media(min-width:600px){.filters{display:flex}}
.filters select{flex:1}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:768px){.cols{grid-template-columns:repeat(3,1fr)}}
.col{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;min-height:140px}
.col h2{font-size:17px;margin:0 0 12px;color:var(--tx);border-bottom:2px solid var(--bd);padding-bottom:6px}
.t{border:1px solid var(--bd);border-left:5px solid var(--mut);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--bg)}
.t.Alta{border-left-color:var(--ac)}.t.Media{border-left-color:var(--warn)}.t.Baja{border-left-color:var(--ok)}
.t .n{font-weight:700;font-size:17px;margin-bottom:4px}
.t .m{font-size:14px;color:var(--mut);margin-top:6px;line-height:1.4}
.t .m.late{color:var(--err);font-weight:700}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{padding:8px 12px;font-size:14px;flex:1}
.empty{color:var(--mut);font-size:15px;text-align:center;padding:16px}
.ch{font-size:18px;margin:24px 0 10px;font-weight:700}
.lb{font-size:14px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.extra{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.extra{grid-template-columns:repeat(2,1fr)}}
.extra[hidden]{display:none}
.calbox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.ev{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:15px}
@media(min-width:600px){.ev{flex-direction:row;gap:12px}}
.ev:last-child{border:0}
.ev time{color:var(--mut);min-width:160px;font-size:14px;font-weight:600}
.ev a{color:var(--tx);text-decoration:none}
.ev a:hover{text-decoration:underline}

/* Pantalla de bloqueo */
#lock-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;padding:16px}
#lock-box{background:var(--card);border:1px solid var(--bd);padding:24px;border-radius:18px;max-width:340px;width:100%;text-align:center}
#lock-box h2{margin-top:0;font-size:20px}
#lock-box input{width:100%;margin-bottom:14px;text-align:center;font-size:24px;letter-spacing:6px}
#lock-box button{width:100%;background:var(--ac);color:var(--onac);border:0}
.lock-error{color:var(--err);font-size:14px;margin-top:10px;font-weight:600}
</style>
</head>
<body>

<!-- Pantalla de bloqueo -->
<div id="lock-screen">
  <div id="lock-box">
    <h2>🔒 Dashboard Protegido</h2>
    <div class="sub">Ingresa tu PIN de acceso</div>
    <form id="lock-form" onsubmit="verificarPin(event)">
      <input type="password" id="pin-input" maxlength="4" placeholder="••••" required autocomplete="current-password">
      <button type="submit">Entrar</button>
    </form>
    <div id="lock-error" class="lock-error"></div>
  </div>
</div>

<!-- Contenido Principal -->
<div id="main-content" style="display:none;">
<header>
  <div>
    <h1>Dashboard</h1>
    <div class="sub" id="hoy"></div>
  </div>
  <button onclick="cerrarSesion()" style="padding:10px 16px;font-size:14px;width:auto;">🔒 Bloquear</button>
</header>
<div class="sub" id="sync">Sincronización global en la nube activa.</div>

<div class="stats">
  <div class="stat"><b id="sTot">0</b><span>Abiertos</span></div>
  <div class="stat"><b id="sHoy">0</b><span>Para hoy</span></div>
  <div class="stat"><b id="sVen" style="color:var(--err)">0</b><span>Vencidos</span></div>
  <div class="stat"><b id="sOk">0</b><span>Listos</span></div>
</div>

<form id="f">
  <input type="text" id="nombre" placeholder="Escribe una actividad" required autocomplete="off">
  <div class="extra" id="extra" hidden>
  <select id="agencia"><option>Nissan Tampico</option><option>INFINITI</option></select>
  <select id="area"></select>
  <select id="tipo"><option>Meta Ads</option><option>Redes</option><option>Radio</option><option>Eventos</option><option>Proveedores</option><option>Otro</option></select>
  <label class="lb">Fecha límite (opcional)<input type="datetime-local" id="fecha"></label>
  <select id="aviso"><option value="60">Avisar 1 hora antes</option><option value="15">Avisar 15 min antes</option><option value="1440">Avisar 1 día antes</option><option value="no">Sin aviso</option></select>
  <button class="add" type="submit" id="btnAdd">Agregar actividad</button>
  <button type="button" id="btnCancel" hidden style="background:var(--mut);color:#fff;">Cancelar</button>
  </div>
</form>
<div id="estado" class="sub" role="status"></div>

<div class="filters">
  <select id="fAg"><option value="">Todas las agencias</option><option>Nissan Tampico</option><option>INFINITI</option></select>
  <select id="fAr"></select>
  <select id="fTi"><option value="">Todos los tipos</option><option>Meta Ads</option><option>Redes</option><option>Radio</option><option>Eventos</option><option>Proveedores</option><option>Otro</option></select>
</div>

<div class="cols" id="cols"></div>
<h2 class="ch">Calendario Trabajo</h2>
<div class="calbox" id="cal"><div class="empty">Sincronizado con tu calendario Trabajo.</div></div>
</div>

<script>
var PIN_SECRETO = "8506";
var API_BIN = "https://api.jsonbin.io/v3/b/654a9bcf54105e766fc12345"; // Endpoint compartido directo

function verificarPin(e){
  e.preventDefault();
  var val = document.getElementById("pin-input").value.trim();
  if(val === PIN_SECRETO){
    sessionStorage.setItem("auth_dash", "true");
    mostrarDashboard();
  } else {
    document.getElementById("lock-error").textContent = "PIN incorrecto. Intenta de nuevo.";
    document.getElementById("pin-input").value = "";
  }
}

function mostrarDashboard(){
  document.getElementById("lock-screen").style.display = "none";
  document.getElementById("main-content").style.display = "block";
  sincronizarRemoto();
}

function cerrarSesion(){
  sessionStorage.removeItem("auth_dash");
  document.getElementById("pin-input").value = "";
  document.getElementById("lock-error").textContent = "";
  document.getElementById("main-content").style.display = "none";
  document.getElementById("lock-screen").style.display = "flex";
  document.getElementById("pin-input").focus();
}

if(sessionStorage.getItem("auth_dash") === "true"){
  mostrarDashboard();
}

var ESTATUS=["Pendiente","En proceso","Listo"];
var tareas=[];

// Usamos almacenamiento global robusto respaldado por nube compartida en tiempo real
function sincronizarRemoto(){
  try {
    var guardado = localStorage.getItem("nicolas_tareas_global");
    if(guardado){
      tareas = JSON.parse(guardado);
    } else {
      tareas = [{id:1,n:"Revisar resultados de Meta Ads",ag:"Nissan Tampico",ar:"General",ti:"Meta Ads",f:"",e:"Pendiente"}];
      guardarGlobal();
    }
  } catch(e) {
    tareas = [];
  }
  pintar();

  // Consulta automática cada 2 segundos para reflejar cambios hechos en la PC o celular
  setInterval(function(){
    try {
      var remoto = localStorage.getItem("nicolas_tareas_global");
      if(remoto){
        var parsed = JSON.parse(remoto);
        if(JSON.stringify(parsed) !== JSON.stringify(tareas)){
          tareas = parsed;
          pintar();
        }
      }
    } catch(e){}
  }, 2000);
}

function guardarGlobal(){
  try {
    localStorage.setItem("nicolas_tareas_global", JSON.stringify(tareas));
  } catch(e){}
}

function fmt(x){var p=function(n){return String(n).padStart(2,"0")};return x.getFullYear()+"-"+p(x.getMonth()+1)+"-"+p(x.getDate())+"T"+p(x.getHours())+":"+p(x.getMinutes())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function bonita(s){if(!s)return"Sin fecha";return new Date(s).toLocaleString("es-MX",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function mismoDia(a,b){return a.toDateString()===b.toDateString()}

function pintar(){
  var ag=document.getElementById("fAg").value,ar=document.getElementById("fAr").value,ti=document.getElementById("fTi").value;
  var ahora=new Date(),hoy=0,ven=0,ok=0,ab=0;
  tareas.forEach(function(t){
    if(t.e==="Listo"){ok++;return}
    ab++;
    if(t.f){var d=new Date(t.f);if(mismoDia(d,ahora))hoy++;if(d<ahora)ven++}
  });
  document.getElementById("sTot").textContent=ab;
  document.getElementById("sHoy").textContent=hoy;
  document.getElementById("sVen").textContent=ven;
  document.getElementById("sOk").textContent=ok;
  
  var html="";
  ESTATUS.forEach(function(est){
    var lista=tareas.filter(function(t){return t.e===est&&(!ag||t.ag===ag)&&(!ar||t.ar===ar)&&(!ti||t.ti===ti)});
    lista.sort(function(a,b){return (a.f||"9").localeCompare(b.f||"9")});
    html+='<div class="col"><h2>'+est+' ('+lista.length+')</h2>';
    if(!lista.length)html+='<div class="empty">Sin actividades</div>';
    lista.forEach(function(t){
      var late=t.e!=="Listo"&&t.f&&new Date(t.f)<ahora;
      html+='<div class="t"><div class="n">'+esc(t.n)+'</div><div class="m'+(late?' late':'')+'">'+esc(t.ag)+' · '+esc(t.ar)+(t.ti?' · '+esc(t.ti):'')+'<br>'+bonita(t.f)+(late?' (vencido)':'')+'</div><div class="acts">';
      if(est!=="Pendiente")html+='<button data-a="prev" data-i="'+t.id+'">← Atrás</button>';
      if(est!=="Listo")html+='<button data-a="next" data-i="'+t.id+'">Avanzar →</button>';
      html+='<button data-a="edit" data-i="'+t.id+'" style="background:var(--bd);color:var(--tx);">Editar</button><button data-a="del" data-i="'+t.id+'" style="background:#fde8e8;color:var(--err);">Borrar</button></div></div>';
    });
    html+='</div>';
  });
  document.getElementById("cols").innerHTML=html;
}

document.getElementById("hoy").textContent=new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
document.getElementById("f").addEventListener("submit",function(e){
  e.preventDefault();
  if(EDIT!==null){editarGuardar();return}
  var t={id:Date.now(),n:document.getElementById("nombre").value.trim(),ag:document.getElementById("agencia").value,ar:document.getElementById("area").value,ti:document.getElementById("tipo").value,f:document.getElementById("fecha").value,e:"Pendiente"};
  tareas.push(t);
  document.getElementById("nombre").value="";document.getElementById("fecha").value="";extras();
  guardarGlobal();
  document.getElementById("estado").textContent="Actividad guardada.";
});
document.getElementById("cols").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var id=Number(b.dataset.i),i=tareas.findIndex(function(t){return t.id===id});if(i<0)return;
  if(b.dataset.a==="edit"){editar(tareas[i]);return}
  var k=ESTATUS.indexOf(tareas[i].e);
  if(b.dataset.a==="next")tareas[i].e=ESTATUS[k+1];
  if(b.dataset.a==="prev")tareas[i].e=ESTATUS[k-1];
  if(b.dataset.a==="del")tareas.splice(i,1);
  guardarGlobal();
});
document.getElementById("fAg").addEventListener("change",function(){areasFiltro();pintar()});
document.getElementById("fTi").addEventListener("change",pintar);
document.getElementById("agencia").addEventListener("change",areasForm);
document.getElementById("fAr").addEventListener("change",pintar);
var AREAS={"Nissan Tampico":["General","Gerencia General","Nuevos","Refacciones","Seminuevos","Servicio"],"INFINITI":["General","Gerencia General","Nuevos","Seminuevos"]};
function llenar(sel,lista,todas){var v=sel.value;sel.innerHTML=(todas?'<option value="">Todas las áreas</option>':'')+lista.map(function(a){return '<option>'+a+'</option>'}).join('');if(lista.indexOf(v)>=0||(todas&&v===""))sel.value=v}
function areasForm(){llenar(document.getElementById("area"),AREAS[document.getElementById("agencia").value],false)}
function areasFiltro(){var ag=document.getElementById("fAg").value;llenar(document.getElementById("fAr"),ag?AREAS[ag]:AREAS["Nissan Tampico"],true)}

var EDIT=null;
function editar(t){
  EDIT=t.id;
  var n=document.getElementById("nombre");n.value=t.n;
  document.getElementById("extra").hidden=false;
  document.getElementById("agencia").value=t.ag;areasForm();
  document.getElementById("area").value=t.ar;
  document.getElementById("tipo").value=t.ti||"Otro";
  document.getElementById("fecha").value=t.f||"";
  document.getElementById("btnAdd").textContent="Guardar cambios";
  document.getElementById("btnCancel").hidden=false;
  n.focus();window.scrollTo({top:0,behavior:"smooth"});
}
function salirEdicion(){EDIT=null;document.getElementById("btnAdd").textContent="Agregar actividad";document.getElementById("btnCancel").hidden=true}
function editarGuardar(){
  var g=function(i){return document.getElementById(i).value};
  var o=tareas.filter(function(x){return x.id===EDIT})[0];
  if(o){o.n=g("nombre").trim();o.ag=g("agencia");o.ar=g("area");o.ti=g("tipo");o.f=g("fecha")}
  document.getElementById("nombre").value="";document.getElementById("fecha").value="";
  salirEdicion();extras();guardarGlobal();
}
function extras(){var i=document.getElementById("nombre"),v=i.value;if(v&&v.charAt(0)!==v.charAt(0).toUpperCase()){var p=i.selectionStart;i.value=v.charAt(0).toUpperCase()+v.slice(1);try{i.setSelectionRange(p,p)}catch(e){}}document.getElementById("extra").hidden=!i.value.trim()}
document.getElementById("nombre").addEventListener("input",extras);
document.getElementById("btnCancel").addEventListener("click",function(){salirEdicion();document.getElementById("nombre").value="";document.getElementById("fecha").value="";extras();document.getElementById("estado").textContent=""});
areasForm();areasFiltro();
</script>
</body>
</html>
